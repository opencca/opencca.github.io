<!-- Custom head -->
<style>
  .landing-button {
    width: 200pt;
  }


.highlight {
  border-radius: 0.25rem;       /* match your card corners */
  border: none;                 /* remove default border */
  background-color: #fff !important; /* white background */
  box-shadow: 0 .125rem .25rem rgba(0,0,0,.075); /* match .shadow-sm */
  padding: 1rem;                /* consistent padding */
}

.highlight pre {
  margin: 0;
  background: transparent;
}

/* Remove default Chroma background for code blocks */
.highlight pre, pre.chroma {
  background: transparent !important;
}

/* Optional: make the code take the card's padding instead */
.highlight {
  background: transparent !important;
  margin: 0;
  padding: 0;
}

.equal-height {
  height: 310px; /* desired height */
  object-fit: cover;
}

.video-container {
  position: relative;
  width: 100%;
  max-width: 100%;
  padding-bottom: 56.25%; /* 16:9 ratio */
  height: 0;
  margin-bottom: 2rem;
}

.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

</style>
